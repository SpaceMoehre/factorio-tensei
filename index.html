<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Factorio Factory Block Blueprint Tool</title>
<style>
  body { font-family: system-ui,sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%); color: #eaeaea; margin: 0; padding: 2rem; min-height: 100vh; }
  h1 { color: #e0c097; letter-spacing: 1px; }
  ::selection { background: #e0c097; color: #1a1a2e; }
  h1 { color: #89b4fa; }
  .grid { display: grid; grid-template-columns: 320px 1fr; gap: 2rem; }
  .panel { background: rgba(26,26,46,0.85); backdrop-filter: blur(6px); padding: 1rem; border-radius: 12px; border: 1px solid rgba(224,192,151,0.25); box-shadow: 0 4px 20px rgba(0,0,0,0.35); overflow: visible !important; }
  #recipe-list { overflow: visible !important; } backdrop-filter: blur(6px); padding: 1rem; border-radius: 12px; border: 1px solid rgba(224,192,151,0.25); box-shadow: 0 4px 20px rgba(0,0,0,0.35); }
  input, select, button { padding: .5rem; font-size: 1rem; border: none; border-radius: 6px; }
  button { background: linear-gradient(180deg, #e0c097, #bfa070); color: #1a1a2e; font-weight: bold; cursor: pointer; border: 1px solid #d4a86e; box-shadow: 0 2px 6px rgba(224,192,151,0.3); }
  button:hover { background: linear-gradient(180deg, #f0d8b5, #d4b890); }
  button:hover { background: #94e2d5; }
  .recipe-row { display: flex; gap: .5rem; align-items: center; margin: .3rem 0; }
  .recipe-row input { width: 60px; }
  pre { background: #181825; padding: .5rem; overflow: auto; border-radius: 6px; }
  #preview { border: 2px solid #585b70; border-radius: 8px; overflow: hidden; }
</style>
</head>
<body>
<h1>Factorio Factory Block Blueprint Tool</h1>
<div class="grid">
  <div>
    <div class="panel">
      <h3>Production Goals (items/min)</h3>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;">
        <button onclick="openItemList()" id="goal-item-btn" style="flex:1;min-width:140px;text-align:left;padding:6px;border-radius:6px;border:1px solid #e0c097;background:#181825;color:#eaeaea;font-size:0.95rem;cursor:pointer;">Select item...</button>
        <input id="goal-rate" type="number" value="30" min="1" style="width:80px;padding:6px;border-radius:6px;border:1px solid #e0c097;background:#181825;color:#eaeaea;" placeholder="/min">
        <button onclick="addGoal()">Add Goal</button>
      </div>
      <div id="goals-list"></div>
    </div>
    <div id="recipe-modal" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:10000;background:#181825;border:2px solid #e0c097;border-radius:12px;padding:1.5rem;max-width:520px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.8);">
      <h3 id="modal-title">Choose Recipe</h3>
      <div id="modal-options"></div>
      <button onclick="closeModal()" style="margin-top:10px;">Close</button>
    </div>
    <div class="panel" style="margin-top:1rem">
      <button onclick="runSolver()">Calculate Blueprint</button>
      <button onclick="runSim()">Run Simulation</button>
      <button onclick="exportBluePrint()">Export Blueprint JSON</button>
      <div id="sim-result" style="margin-top:.5rem"></div>
    </div>
  </div>
  <div>
    <div class="panel" style="margin-top:1rem">
      <h3>Sprites (Factorio icons)</h3>
      <div id="sprite-bar" style="display:flex;flex-wrap:wrap;gap:8px;"></div>
    </div>
    <div class="panel">
      <h3>Layout Preview</h3>
      <div id="preview"></div>
    </div>
    <div class="panel" style="margin-top:1rem">
      <h3>Blueprint / Data</h3>
      <pre id="bp-output">Select recipes and calculate.</pre>
    </div>
  </div>
</div>

<script type="module">
  import { Solver } from './js/solver.js';
  import { Simulator } from './js/sim.js';
  import { BlueprintEncoder } from './js/blueprint.js';
  import { Renderer } from './js/render.js';

  const catalog = await fetch('data/catalog.json').then(r => r.json());
  const recipesFull = await fetch('data/recipes_full.json').then(r => r.json());
  const sprites = await fetch('data/sprites.json').then(r => r.json());
  const recipeNames = recipesFull.recipe_names || Object.keys(recipesFull.recipes || {});
  const recipes = Object.keys(catalog.recipes);
  let config = [{recipe:recipeNames[0]||'advanced-circuit', count:2}];

  function renderRecipeList() {
    const list = document.getElementById('recipe-list');
    list.innerHTML = '';
    config.forEach((c,i) => {
      const row = document.createElement('div'); row.className = 'recipe-row';
      const iconName = c.recipe.replace(/-/g,'_');
      row.innerHTML = `<img src="sprites/${c.recipe}.png" style="width:28px;height:28px;object-fit:contain;border:1px solid #e0c097;border-radius:4px;" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block'" title="${c.recipe}"><span style="display:none;font-size:10px">${c.recipe}</span><div style="position:relative;display:inline-block;vertical-align:middle"><button onclick="openGlobalDropdown(${i},this)" style="width:140px;text-align:left;background:#2a2638;border:1px solid #e0c097;color:#eaeaea;padding:4px 6px;border-radius:6px;font-size:0.85rem;">${c.recipe}</button></div><input type="number" value="${c.count}" min="1" onchange="updateCount(${i},this.value)"><button onclick="removeRecipe(${i})">×</button>`;
      list.appendChild(row);
    });
  }
  window.updateRecipe = (i,v) => { config[i].recipe = v; renderGoals(); };
  window.updateCount = (i,v) => { config[i].count = parseInt(v||1); };
  window.removeRecipe = (i) => { config.splice(i,1); renderGoals(); };
  window.addRecipeRow = () => { config.push({recipe:recipeNames[0]||'advanced-circuit', count:1}); renderGoals(); };

  let lastResult = null;
  window.openGlobalDropdown = (idx, btn) => {
    const d = document.getElementById('global-dropdown');
    const rect = btn.getBoundingClientRect();
    d.style.display = 'block';
    d.style.top = (rect.bottom + window.scrollY + 2) + 'px';
    d.style.left = (rect.left + window.scrollX) + 'px';
    const c = config[idx];
    d.innerHTML = recipeNames.map(r => `<button onclick="updateRecipe(${idx},'${r}');document.getElementById('global-dropdown').style.display='none';document.querySelectorAll('.recipe-row button')[${idx}].textContent='${r}'" style="display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:5px 8px;background:transparent;border:none;color:#eaeaea;cursor:pointer;font-size:0.85rem;border-bottom:1px solid rgba(224,192,151,0.15);"><img src="sprites/${r}.png" style="width:20px;height:20px;object-fit:contain;border:1px solid #e0c097;border-radius:3px;" onerror="this.style.display='none'"><span>${r}</span></button>`).join('');
  };
  document.addEventListener('click', e => { if (!e.target.closest('#global-dropdown') && !e.target.closest('.recipe-row button')) document.getElementById('global-dropdown').style.display='none'; });
  window.renderSprites = () => {
    const bar = document.getElementById('sprite-bar');
    if (!bar || !sprites) return;
    const keys = Object.keys(sprites.icons || {}).slice(0,12);
    bar.innerHTML = keys.map(k => {
      const path = sprites.icons[k];
      return `<div style="text-align:center"><img src="sprites/${k}.png" style="width:32px;height:32px;object-fit:contain" onerror="this.style.display='none';this.nextElementSibling.textContent='${k}'" title="${k}"><div style="font-size:9px">${k}</div></div>`;
    }).join('');
  };
  window.runSolver = () => {
    const cfg = goals.filter(g=>g.recipe).map(g=>({recipe:g.recipe, count: Math.max(1,Math.round(g.rate/15))}));
    if(cfg.length===0){alert('Add at least one completed goal'); return;}
    const s = new Solver(catalog, cfg);
    s.mergeBelts();
    lastResult = s.solve();
    document.getElementById('bp-output').textContent = JSON.stringify(lastResult, null, 2).slice(0,2000);
    new Renderer().render(lastResult, 'preview');
  };

  window.runSim = () => {
    if (!lastResult) { lastResult = new Solver(catalog, config).solve(); }
    const sim = new Simulator(lastResult, catalog);
    const res = sim.run();
    document.getElementById('sim-result').innerHTML = `<strong>Simulation:</strong> ${res.ok ? 'OK' : 'STARVATION'}<br><pre>${JSON.stringify(res.starvation, null, 2)}</pre>`;
  };

  window.exportBluePrint = () => {
    if (!lastResult) window.runSolver();
    const enc = new BlueprintEncoder();
    document.getElementById('bp-output').textContent = enc.encode(lastResult);
  };

  renderGoals();
  renderSprites();

  function renderGoals() {
    const list = document.getElementById('goals-list');
    if (!list) return;
    list.innerHTML = '';
    goals.forEach((g,i) => {
      const row = document.createElement('div'); row.className='recipe-row';
      row.innerHTML = `<img src="sprites/${g.item}.png" style="width:28px;height:28px;object-fit:contain;border:1px solid #e0c097;border-radius:4px;cursor:pointer;" onclick="openRecipeModal(${i})" title="choose recipe"><div style="flex:1"><strong>${g.item}</strong> @ ${g.rate||30}/min <div style="font-size:0.75rem;color:#aaa;">recipe: ${g.recipe||'?'} · inputs: ${g.inputs||'?'}</div></div><button onclick="removeGoal(${i})">×</button>`;
      list.appendChild(row);
    });
  }

  let goals = [];
  window.openItemList = () => {
    try {
    const d = document.getElementById('global-dropdown');
    const btn = document.getElementById('goal-item-btn');
    const rect = btn.getBoundingClientRect();
    d.style.display = 'block';
    d.style.top = (rect.bottom + window.scrollY + 2) + 'px';
    d.style.left = (rect.left + window.scrollX) + 'px';
    const all = Object.keys(catalog.recipes||{});
    d.innerHTML = all.map(i => `<button onclick="document.getElementById('goal-item-btn').textContent='${i}';document.getElementById('goal-item-btn').dataset.item='${i}';document.getElementById('global-dropdown').style.display='none'" style="display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;background:transparent;border:none;color:#eaeaea;cursor:pointer;font-size:0.85rem;border-bottom:1px solid rgba(224,192,151,0.15);"><img src="sprites/${i}.png" style="width:22px;height:22px;object-fit:contain;border:1px solid #e0c097;border-radius:3px;" onerror="this.style.display='none'"><span>${i}</span></button>`).join('');
    } catch(e) { alert('openItemList error: '+e); }
  };

</script>
<div id="global-dropdown" style="display:none;position:fixed;z-index:9999;background:#181825;border:1px solid #e0c097;border-radius:8px;max-height:260px;overflow-y:auto;width:160px;box-shadow:0 12px 40px rgba(0,0,0,0.8);"></div></body>
</html>
