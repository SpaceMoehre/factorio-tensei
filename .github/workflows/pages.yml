# Publishes the planner to GitHub Pages: the page, its modules and the catalog, with icons
# extracted from the zips attached to the Pyanodons repositories' releases. The site is built on
# every push to master and to claude/ branches (to check it); master's goes to the gh-pages branch,
# which Pages serves.
name: Pages

on:
  push:
    branches: [master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Recent releases carry no zips, so each repository's newest release that has any is used
      # (older Py packages bundled their graphics).
      - name: Download the Pyanodons release zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir mods
          for repo in $(gh repo list pyanodon --limit 200 --json name --jq '.[].name'); do
            used=""
            for tag in $(gh release list --repo "pyanodon/$repo" --limit 200 --json tagName --jq '.[].tagName'); do
              if gh release download "$tag" --repo "pyanodon/$repo" --pattern '*.zip' --dir mods 2>/dev/null; then
                used="$tag"
                break
              fi
            done
            echo "$repo: ${used:-no release zips}"
          done
          ls -la mods
      - name: Collect the site
        run: |
          mkdir site
          cp -r index.html js data site/
          node scripts/site-sprites.mjs mods site
      # Pages serves the gh-pages branch: master's site replaces it, as one commit.
      - name: Publish to gh-pages
        if: github.ref == 'refs/heads/master'
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Site from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
